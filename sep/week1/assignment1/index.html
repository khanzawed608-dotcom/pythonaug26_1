<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lumina Login Screen</title>
    <link rel="stylesheet" href="style.css">
 
</head>
<body>
    <div class="main-container">
        <div class="login-section">
            <div class="logo">
                <span>Lumina</span>
            </div>
            
            <h2>Welcome back!</h2>
            <p class="subtitle">Pick up where you left off, and keep things moving .</p>
            
            <form>
                <div class="input-group">
                    <input type="email" placeholder="john.doe@gmail.com" required>
                </div>
                
                <div class="input-group password-group">
                    <input type="password" placeholder="••••••••" id="password-field" required>
                                  
                </div>
                
                <div class="form-options">
                    <label class="remember-me">
                        <input type="checkbox"> Remember me
                    </label>
                    <a href="#" class="forgot-password">Forgot password?</a>
                </div>
                
                <button type="submit" class="login-btn">Log in </button>
            </form>
            
            <div >
                <span>or</span>
            </div>
            
            <button class="google-btn">
                <img src="https://upload.wikimedia.org/wikipedia/commons/5/53/Google__G__Logo.svg" alt="Google Logo">
                Continue with Google
            </button>
            
            <div class="signup-prompt">
                Don't have an account? <a href="#">Sign up</a>
            </div>
        </div>
          <div class="illustration-section">
      
            </div>
    </div>

   
</body>
</html>
