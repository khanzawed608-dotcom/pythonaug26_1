  <!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Do and Don't Form</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <!-- DO -->
        <div class="section">
            <h1>DO:</h1>

            <div class="form-box">
                <label>Name</label>
                <input type="text" placeholder="Name">

                <label>Email</label>
                <input type="email" placeholder="Email">

                <label>Company</label>
                <input type="text" placeholder="Company">
            </div>
        </div>

        <!-- DON'T -->
        <div class="section">
            <h1>DON’T:</h1>

            <div class="form-box">
                <label>Name</label>
                <input type="text" placeholder="Name">

                <label>Email</label>
                <input type="email" placeholder="Email">

                <label>Company</label>
                <input type="text" placeholder="Company">
            </div>
        </div>

    </div>

</body>
</html>
  
</body>
</html>
