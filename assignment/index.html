<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Card Design</title>

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #eeeeee;
            font-family: Arial, sans-serif;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Card */
        .card {
            width: 650px;
            background-color: white;
            border-radius: 30px;
            overflow: hidden;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.15);
        }

        /* Image Section */
        .image-box {
            height: 390px;
            background-color: #a9e8c8;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        .image-icon {
            font-size: 75px;
            opacity: 0.5;
        }

        /* Content */
        .content {
            padding: 35px 40px 30px;
        }

        /* Label */
        .label {
            display: inline-block;
            background-color: #c9c9ce;
            color: #333;

            font-size: 20px;
            font-weight: bold;

            padding: 12px 45px;
            border-radius: 18px;

            margin-bottom: 20px;
        }

        /* Heading */
        h1 {
            font-size: 45px;
            color: #111;
            margin-bottom: 18px;
        }

        /* Description */
        p {
            font-size: 25px;
            line-height: 1.4;
            color: #777;
            margin-bottom: 30px;
        }

        /* Button */
        button {
            width: 100%;
            height: 70px;

            border: none;
            border-radius: 40px;

            background-color: #4775e8;
            color: white;

            font-size: 27px;
            cursor: pointer;
        }

        button:hover {
            background-color: #315fd5;
        }

        /* Mobile */
        @media (max-width: 700px) {
            .card {
                width: 90%;
            }

            .image-box {
                height: 280px;
            }

            .content {
                padding: 25px;
            }

            h1 {
                font-size: 35px;
            }

            p {
                font-size: 20px;
            }

            button {
                height: 60px;
                font-size: 22px;
            }
        }
    </style>
</head>

<body>

    <div class="card">

        <div class="image-box">
            <div class="image-icon">🖼️</div>
        </div>

        <div class="content">

            <span class="label">Label</span>

            <h1>Heading</h1>

            <p>
                This is a short description about
                the card.
            </p>

            <button>Action</button>

        </div>

    </div>

</body>
</html>
